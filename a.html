<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>math_unerring — Mathematical Reels (Lite)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --reel-w: 405px;
    --reel-h: 720px;
  }

  body {
    background: #0d0d0d;
    min-height: 100vh;
    height: 100vh;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* ── LEFT: reel ── */
  .reel-col {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }

  /* ── RIGHT: controls ── */
  .ctrl-col {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 32px 28px;
    border-left: 1px solid #1e1e1e;
    background: #0a0a0a;
    min-width: 200px;
    max-width: 300px;
    overflow-y: auto;
  }

  .ctrl-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ctrl-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    font-family: monospace;
    margin-bottom: 2px;
  }

  .controls-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  select {
    flex: 1;
    min-width: 0;
    background: #1a1a1a;
    color: #ccc;
    border: 1px solid #2a2a2a;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    appearance: none;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  select:hover { border-color: #444; }

  .btn {
    background: #1a1a1a;
    color: #ccc;
    border: 1px solid #2a2a2a;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover { background: #2a2a2a; color: #fff; border-color: #444; }
  .btn.primary { background: #fff; color: #000; border-color: #fff; }
  .btn.primary:hover { background: #ddd; }

  .reel-outer {
    position: relative;
    height: min(calc(100vh - 40px), var(--reel-h));
    aspect-ratio: 9 / 16;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 1px #222, 0 32px 80px rgba(0,0,0,.85);
    flex-shrink: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 62px 20px 58px;
  }

  .top-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .cat-tag {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,.45);
    font-family: monospace;
  }

  .pat-name {
    font-size: clamp(22px, 6vw, 32px);
    letter-spacing: 3px;
    color: #fff;
    line-height: 1;
    font-weight: 700;
    text-transform: uppercase;
    transition: color .6s;
  }

  .bottom-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    width: 100%;
  }

  .eq-box {
    background: rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 12px 20px;
    max-width: 92%;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 11px;
    color: rgba(255,255,255,.85);
    text-align: center;
    word-break: break-word;
    line-height: 1.5;
  }
  .eq-box svg { max-width: 100%; height: auto; }
  .eq-box .katex { color: rgba(255,255,255,.9); font-size: 1em; }

  .watermark {
    font-size: 11px;
    letter-spacing: 3.5px;
    color: rgba(255,255,255,.3);
    text-align: center;
    font-family: monospace;
  }

  .prog-track {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,.08);
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: #fff;
    opacity: .6;
    transition: width .1s linear;
  }

  .speed-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .speed-lbl {
    font-size: 11px;
    color: #555;
    letter-spacing: 1px;
    margin-right: 4px;
    font-family: monospace;
  }
  .spd-btn {
    background: #1a1a1a;
    color: #555;
    border: 1px solid #2a2a2a;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    cursor: pointer;
    transition: all .15s;
  }
  .spd-btn:hover { color: #ccc; border-color: #444; }
  .spd-btn.active { background: #fff; color: #000; border-color: #fff; }
</style>
</head>
<body>

<div class="reel-col">
  <div class="reel-outer" id="reelOuter">
    <canvas id="c"></canvas>
    <div class="overlay">
      <div class="top-info">
        <div class="cat-tag" id="lCat"></div>
        <div class="pat-name" id="lName"></div>
      </div>
      <div class="bottom-info">
        <div class="eq-box" id="eqBox"></div>
        <div class="watermark">@math_unerring</div>
      </div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  </div>
</div>

<div class="ctrl-col">
  <div class="ctrl-section">
    <div class="ctrl-label">Pattern</div>
    <select id="patSel"></select>
  </div>

  <div class="ctrl-section">
    <div class="ctrl-label">Playback</div>
    <div class="controls-bar">
      <button class="btn primary" id="playBtn" style="width:100%">&#9654; Play</button>
      <button class="btn" id="restBtn" style="width:100%">&#8634; Restart</button>
    </div>
  </div>

  <div class="ctrl-section">
    <div class="ctrl-label">Speed</div>
    <div class="speed-row">
      <button class="spd-btn" id="s05">0.5&times;</button>
      <button class="spd-btn active" id="s10">1&times;</button>
      <button class="spd-btn" id="s20">2&times;</button>
    </div>
  </div>
</div>

<script>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CW = 405, CH = 720;
canvas.width = CW; canvas.height = CH;

function hsv(h,s=1,v=1){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),w=v*(1-(1-f)*s),rgb=[[v,w,p],[q,v,p],[p,v,w],[p,q,v],[w,p,v],[v,p,q]][i%6].map(c=>(c*255)|0);return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;}
function rbow(i,n,off=0){return hsv((i/Math.max(n,1)+off)%1,1,1);}
function cls(){ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);}
function fadeBg(a=0.1){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,CW,CH);}
function glow(c,b=24){}
function ng(){}
function seg(x1,y1,x2,y2,c,lw=3,gb=24){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function dot2(x,y,r,c,gb=16){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function gcd(a,b){return b===0?a:gcd(b,a%b);}

const CX=CW/2, CY=CH/2, SC=Math.min(CW,CH)/700;
let speedMult=1;

const PATTERNS=[
  // ── ORIGINAL 20 ────────────────────────────────────────────────────────
  {
    name:'Times Table Circle',cat:'Modular Arithmetic',
    latex:'\\(z_k \\rightarrow z_{m \\cdot k \\bmod N}, \\quad m \\in [2,\\,10]\\)',color:'#ff6b9d',
    init(d){d.N=200;d.m=2;d.frame=0;d.total=Infinity;},
    draw(d){
      cls();d.m=2+(d.frame/d.total)*8;const R=322*SC;
      const pts=Array.from({length:d.N},(_,i)=>[CX+R*Math.cos(i*2*Math.PI/d.N-Math.PI/2),CY+R*Math.sin(i*2*Math.PI/d.N-Math.PI/2)]);
      ctx.strokeStyle='rgba(80,30,110,.14)';ctx.lineWidth=1.2;
      ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.stroke();
      ctx.lineWidth=1.6;
      for(let i=0;i<d.N;i++){const j=(i*d.m)%d.N,ji=j|0,fr=j-ji;const[x1,y1]=pts[ji],[x2,y2]=pts[(ji+1)%d.N];const c=rbow(i,d.N,d.m/13);ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(x1+fr*(x2-x1),y1+fr*(y2-y1));ctx.stroke();}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Spirograph',cat:'Hypotrochoid',
    latex:'\\(x=(R-r)\\cos\\theta+d\\cos\\!\\left(\\tfrac{R-r}{r}\\theta\\right)\\)',color:'#c44dff',
    init(d){d.R=155;d.r=73;d.D=205;const g=gcd(155,73);d.laps=73/g;d.N=d.laps*400;d.step=0;d.last=null;d.frame=0;d.total=Infinity;},
    draw(d){
      const{R,r,D,laps,N}=d;const spf=Math.ceil(5*speedMult);
      for(let k=0;k<spf;k++){const i=d.step;if(i>=N)break;const a=i*2*Math.PI*laps/N;const x=CX+((R-r)*Math.cos(a)+D*Math.cos((R-r)/r*a))*SC;const y=CY+((R-r)*Math.sin(a)-D*Math.sin((R-r)/r*a))*SC;const c=rbow(i,N,.15);if(d.last)seg(d.last[0],d.last[1],x,y,c,2.8,16);d.last=[x,y];d.step++;}
      d.frame++;return Math.min(1,d.step/N);
    }
  },
  {
    name:'Lissajous Figures',cat:'Coupled Oscillators',
    latex:'\\(x=A\\sin(a\\omega t+\\delta),\\quad y=B\\sin(b\\omega t)\\)',color:'#4daaff',
    init(d){d.combos=[[1,2],[1,3],[2,3],[3,4],[3,5]];d.frame=0;d.total=Infinity;},
    draw(d){
      cls();const ci=Math.floor(d.frame/110)%d.combos.length;const[a,b]=d.combos[ci];const delta=(d.frame%110)/110*2*Math.PI;
      const A=322*SC,B=322*SC,N=1200;ctx.lineWidth=2.8;let lx=null,ly=null;
      for(let i=0;i<=N;i++){const t=i*2*Math.PI/N;const x=CX+A*Math.sin(a*t+delta),y=CY+B*Math.sin(b*t);const c=rbow(i,N,ci*0.16);if(lx!==null){ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();}lx=x;ly=y;}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Polar Rose Bloom',cat:'Rhodonea Curves',
    latex:'\\(r=\\cos(k\\theta),\\quad k\\in[1,\\,8]\\)',color:'#ff4da6',
    init(d){d.frame=0;d.total=Infinity;},
    draw(d){
      cls();const k=1+(d.frame/d.total)*7;const R=322*SC,N=1600;
      const periods=k===Math.round(k)&&Math.round(k)%2===0?2:1;ctx.lineWidth=2.8;let lx=null,ly=null;
      for(let i=0;i<=N;i++){const th=i*periods*Math.PI/N,r=R*Math.cos(k*th);const x=CX+r*Math.cos(th),y=CY+r*Math.sin(th);const c=rbow(i,N,k/10);if(lx!==null){ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();}lx=x;ly=y;}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Sunflower Phyllotaxis',cat:'Golden Angle',
    latex:'\\(r=\\sqrt{n},\\quad\\theta=n\\times137.508^\\circ\\)',color:'#ffd93d',
    init(d){d.n=0;d.GA=137.508*Math.PI/180;d.frame=0;d.total=Infinity;},
    draw(d){
      const{GA}=d;const spf=Math.ceil(5*speedMult);
      for(let k=0;k<spf;k++){const n=d.n;if(n>1500)break;const r=9.5*Math.sqrt(n)*SC,th=n*GA;if(r>322*SC)break;const x=CX+r*Math.cos(th),y=CY+r*Math.sin(th);const sz=Math.max(3,(4.5+3*n/1500)*SC);dot2(x,y,sz,rbow(n,1500,.08),12);d.n++;}
      d.frame++;return Math.min(1,d.n/1500);
    }
  },
  {
    name:'Double Pendulum',cat:'Chaotic Attractor',
    latex:'\\(\\ddot{\\theta}_1=f(g,L_1,L_2,m_1,m_2,\\theta_1,\\theta_2,\\dot{\\theta}_1,\\dot{\\theta}_2)\\)',color:'#ff7c3e',
    init(d){d.th1=2.4;d.th2=1.8;d.w1=0;d.w2=0;d.trail=[];d.frame=0;d.total=Infinity;d.dt=0.022;},
    draw(d){
      const g=9.81,L1=1.4,L2=1.0,m1=1,m2=1,rsc=134*SC;const stps=Math.ceil(5*speedMult);
      for(let s=0;s<stps;s++){const{th1,th2,w1,w2}=d,dd=th1-th2;const den=2*m1+m2-m2*Math.cos(2*dd);const a1=(-g*(2*m1+m2)*Math.sin(th1)-m2*g*Math.sin(th1-2*th2)-2*Math.sin(dd)*m2*(w2*w2*L2+w1*w1*L1*Math.cos(dd)))/(L1*den);const a2=(2*Math.sin(dd)*(w1*w1*L1*(m1+m2)+g*(m1+m2)*Math.cos(th1)+w2*w2*L2*m2*Math.cos(dd)))/(L2*den);d.th1+=d.w1*d.dt;d.th2+=d.w2*d.dt;d.w1+=a1*d.dt;d.w2+=a2*d.dt;const x2=CX+(L1*Math.sin(d.th1)+L2*Math.sin(d.th2))*rsc;const y2=CY+(-L1*Math.cos(d.th1)-L2*Math.cos(d.th2))*rsc;d.trail.push([x2,y2]);if(d.trail.length>2500)d.trail.shift();}
      fadeBg(.07);ctx.lineWidth=2.8;
      for(let i=1;i<d.trail.length;i++){const p=i/d.trail.length,c=rbow(i,d.trail.length,.65);ctx.globalAlpha=p*.88;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(d.trail[i-1][0],d.trail[i-1][1]);ctx.lineTo(d.trail[i][0],d.trail[i][1]);ctx.stroke();}
      ctx.globalAlpha=1;
      const x1c=CX+L1*Math.sin(d.th1)*rsc,y1c=CY-L1*Math.cos(d.th1)*rsc;const x2c=CX+(L1*Math.sin(d.th1)+L2*Math.sin(d.th2))*rsc;const y2c=CY+(-L1*Math.cos(d.th1)-L2*Math.cos(d.th2))*rsc;
      seg(CX,CY,x1c,y1c,'rgba(255,255,255,.4)',3,0);seg(x1c,y1c,x2c,y2c,'rgba(255,255,255,.4)',3,0);dot2(x1c,y1c,9*SC,'#9be',12);dot2(x2c,y2c,13*SC,'#f74',22);
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Lorenz Attractor',cat:'Strange Attractor',
    latex:'\\(\\dot{x}=\\sigma(y-x),\\;\\dot{y}=x(\\rho-z)-y,\\;\\dot{z}=xy-\\beta z\\)',color:'#e879f9',
    init(d){d.x=.1;d.y=0;d.z=0;d.last=null;d.frame=0;d.total=Infinity;},
    draw(d){
      const sig=10,rho=28,beta=8/3,dt=.007;const spf=Math.ceil(14*speedMult);
      for(let k=0;k<spf;k++){const{x,y,z}=d;d.x+=sig*(y-x)*dt;d.y+=(x*(rho-z)-y)*dt;d.z+=(x*y-beta*z)*dt;const px=CX+d.x*11*SC,py=CY-(d.z-25)*11*SC;const c=rbow(d.frame*spf+k,8400,.62);if(d.last)seg(d.last[0],d.last[1],px,py,c,2.4,14);d.last=[px,py];}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Koch Snowflake',cat:'Fractal Curve',
    latex:'\\(\\text{Perimeter}=L\\cdot\\left(\\tfrac{4}{3}\\right)^n\\rightarrow\\infty\\)',color:'#60a5fa',
    init(d){d.depth=1;d.depthT=0;d.frame=0;d.total=Infinity;d.kp=(pts)=>{const r=[];for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1],dx=x2-x1,dy=y2-y1;r.push(pts[i],[x1+dx/3,y1+dy/3],[x1+dx/2-dy*Math.sqrt(3)/6,y1+dy/2+dx*Math.sqrt(3)/6],[x1+2*dx/3,y1+2*dy/3]);}r.push(pts[pts.length-1]);return r;};},
    draw(d){
      cls();const L=350;const base=[[CX-L*SC/2,CY+(L*SC*.577/2)],[CX+L*SC/2,CY+(L*SC*.577/2)],[CX,CY-(L*SC*.577)],[CX-L*SC/2,CY+(L*SC*.577/2)]];
      let pts=[...base];for(let i=0;i<d.depth;i++)pts=d.kp(pts);
      ctx.lineWidth=Math.max(1,3.8-d.depth*.42);let lx=null,ly=null;
      for(let i=0;i<pts.length;i++){const[x,y]=pts[i],c=rbow(i,pts.length,d.depth*.12);if(lx!==null){ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();}lx=x;ly=y;}
      d.depthT++;if(d.depthT>80){d.depthT=0;d.depth=d.depth<7?d.depth+1:1;}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Barnsley Fern',cat:'Iterated Function System',
    latex:'\\(\\mathbf{x}_{n+1}=f_i(\\mathbf{x}_n)\\text{ (IFS chaos game)}\\)',color:'#4ade80',
    init(d){d.x=0;d.y=0;d.frame=0;d.total=Infinity;},
    draw(d){
      const spf=Math.ceil(700*speedMult);
      for(let k=0;k<spf;k++){const r=Math.random(),{x,y}=d;let nx,ny;if(r<.01){nx=0;ny=.16*y;}else if(r<.86){nx=.85*x+.04*y;ny=-.04*x+.85*y+1.6;}else if(r<.93){nx=.2*x-.26*y;ny=.23*x+.22*y+1.6;}else{nx=-.15*x+.28*y;ny=.26*x+.24*y+.44;}d.x=nx;d.y=ny;const px=CX+nx*48*SC,py=CY-ny*48*SC+230*SC;dot2(px,py,1.8,rbow(d.frame*spf+k,90000,.31),6);}
      d.frame++;return d.frame/d.total;
    }
  },
  {
    name:'Butterfly Curve',cat:'Polar Rose Variant',
    latex:'\\(r=e^{\\cos\\theta}-2\\cos4\\theta+\\sin^5\\!\\tfrac{\\theta}{12}\\)',color:'#fbbf24',
    init(d){d.step=0;d.N=5500;d.last=null;d.frame=0;d.total=Infinity;},
    draw(d){
      const sc=68*SC;const spf=Math.ceil(9*speedMult);
      for(let k=0;k<spf;k++){const i=d.step;if(i>=d.N)break;const th=i*24*Math.PI/d.N;const r=(Math.exp(Math.cos(th))-2*Math.cos(4*th)+Math.pow(Math.sin(th/12),5))*sc;const x=CX+r*Math.cos(th),y=CY-r*Math.sin(th);const c=rbow(i,d.N,.3);if(d.last)seg(d.last[0],d.last[1],x,y,c,2.8,16);d.last=[x,y];d.step++;}
      d.frame++;return Math.min(1,d.step/d.N);
    }
  },
  {
    name:'Fourier Epicycles',cat:'Harmonic Analysis',
    latex:'\\(f(t)=\\sum_{k=1,3,5\\ldots}\\frac{4}{k\\pi}\\sin(k\\omega t)\\)',color:'#4dffc4',
    init(d){d.freqs=[];d.amps=[];for(let k=1;k<=23;k+=2){d.freqs.push(k);d.amps.push(4/(k*Math.PI));}d.traced=[];d.frame=0;d.total=Infinity;},
    draw(d){
      cls();const{freqs,amps,frame}=d;const ang=frame*2*Math.PI/480;const ocx=CX-126*SC,ocy=CY;let x=ocx,y=ocy;
      for(let i=0;i<freqs.length;i++){const r=amps[i]*196*SC;const nx=x+r*Math.cos(freqs[i]*ang);const ny=y+r*Math.sin(freqs[i]*ang);ctx.strokeStyle=`rgba(255,255,255,${.18-.012*i})`;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.stroke();const c=rbow(i,freqs.length,.6);seg(x,y,nx,ny,c,1.5,8);x=nx;y=ny;}

      for(const t of d.trails){const{x,y}=t;const gx=(d.loss(x+eps,y)-d.loss(x-eps,y))/(2*eps);const gy=(d.loss(x,y+eps)-d.loss(x,y-eps))/(2*eps);t.x-=lr*gx;t.y-=lr*gy;t.hist.push([t.x,t.y]);if(t.hist.length>2){const a=t.hist[t.hist.length-2],b=t.hist[t.hist.length-1];const ax=CX+(a[0]/4)*CW*.48,ay=CY+(a[1]/4)*CH*.48;const bx=CX+(b[0]/4)*CW*.48,by=CY+(b[1]/4)*CH*.48;seg(ax,ay,bx,by,rbow(t.c,.8,1),2.5,12);}dot2(CX+(t.x/4)*CW*.48,CY+(t.y/4)*CH*.48,5*SC,'#fff',15);}
      d.frame++;return d.frame/d.total;
    }
  },
  // 86
  {
    name:'Chaotic Waterwheel',cat:'Lorenz Waterwheel',
    latex:'\\(\\dot{a}_n=\\omega b_n-Ka_n+q_n,\\;\\dot\\omega=-(v+K)\\omega+\\tfrac{\\pi gr}{I}\\sum na_n\\)',color:'#f97316',
    init(d){d.th=0;d.om=1;d.N=8;d.a=new Float32Array(d.N).fill(0);d.b=new Float32Array(d.N).fill(0);d.a[1]=1;d.frame=0;d.total=Infinity;},
    draw(d){
      fadeBg(.08);const g=9.81,r=1,I=1,K=1,v=0.5,q1=1;const dt=0.04;const spf=Math.ceil(3*speedMult);
      for(let s=0;s<spf;s++){const na=new Float32Array(d.N),nb=new Float32Array(d.N);for(let n=0;n<d.N;n++){na[n]=d.a[n]+dt*(d.om*d.b[n]-K*d.a[n]);nb[n]=d.b[n]+dt*(-d.om*d.a[n]-K*d.b[n]+(n===1?q1:0));}let torq=0;for(let n=1;n<d.N;n++)torq+=n*na[n];d.om+=dt*(-(v+K)*d.om+Math.PI*g*r/I*torq);d.th=(d.th+d.om*dt)%(2*Math.PI);d.a=na;d.b=nb;}
      const R=280*SC;for(let i=0;i<d.N;i++){const ang=d.th+i*2*Math.PI/d.N;const x=CX+R*Math.cos(ang),y=CY+R*Math.sin(ang);const fill=Math.max(0,d.a[i])*40*SC;const c=rbow(i/d.N+d.frame*.001,.9,1);dot2(x,y,Math.max(5,fill),c,20);seg(CX,CY,x,y,'rgba(255,255,255,.1)',1,0);}
      d.frame++;return d.frame/d.total;
    }
  },
  // 87
  {
    name:'Flame Fractal',cat:'IFS Variant',
    latex:'\\(F(x,y)=\\sum_i w_i\\cdot V_j(a_ix+b_iy+c_i,d_ix+e_iy+f_i)\\)',color:'#fb923c',
    init(d){d.x=0;d.y=0;d.frame=0;d.total=Infinity;},
    draw(d){
      const spf=Math.ceil(600*speedMult);
      for(let k=0;k<spf;k++){const r=Math.random();let nx,ny;if(r<.25){nx=.5*d.x;ny=.5*d.y;}else if(r<.5){nx=.5*d.x+.5;ny=.5*d.y;}else if(r<.75){nx=.5*d.x+.25;ny=.5*d.y-.5*Math.sqrt(3)/2;}else{const r2=d.x*d.x+d.y*d.y||.001;nx=d.x/r2;ny=-d.y/r2;}d.x=nx;d.y=ny;const px=CX+d.x*340*SC-170*SC;const py=CY+d.y*340*SC-170*SC;dot2(px,py,1.2,rbow(d.frame*spf+k,200000,.08),3);}
      d.frame++;return Math.min(1,d.frame/d.total);
    }
  },
  // 88
  {
    name:'Resonance Modes',cat:'Standing Waves',
    latex:'\\(y=A\\sin(kx)\\cos(\\omega t),\\quad k=n\\pi/L\\)',color:'#a78bfa',
    init(d){d.frame=0;d.total=Infinity;},
    draw(d){
      cls();const t=d.frame*.04;const modes=[1,2,3,4,5,6];const L=CW;
      modes.forEach((n,idx)=>{const yOff=CY+(-2.5+idx)*75*SC;ctx.lineWidth=2;let lx=null,ly=null;for(let px=0;px<L;px+=3){const x=px/L;const y=yOff+Math.sin(n*Math.PI*x)*45*SC*Math.cos(n*t);const c=rbow(idx/modes.length,.9,.1);if(lx!==null){ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(px,y);ctx.stroke();}lx=px;ly=y;}});
      d.frame++;return d.frame/d.total;
    }
  },
  // 89
  {
    name:'Geodesic Sphere',cat:'Spherical Geometry',
    latex:'\\(V-E+F=2\\text{ (Euler characteristic)}\\)',color:'#e2e8f0',
    init(d){
      const t=(1+Math.sqrt(5))/2;
      const verts=[[1,t,0],[-1,t,0],[1,-t,0],[-1,-t,0],[0,1,t],[0,-1,t],[0,1,-t],[0,-1,-t],[t,0,1],[-t,0,1],[t,0,-1],[-t,0,-1]].map(v=>{const l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);return v.map(x=>x/l);});
      const edges=[];for(let i=0;i<verts.length;i++)for(let j=i+1;j<verts.length;j++){const d2=verts[i].reduce((s,_,k)=>(verts[i][k]-verts[j][k])**2+s,0);if(Math.abs(Math.sqrt(d2)-1.176)<.1)edges.push([i,j]);}
      d.verts=verts;d.edges=edges;d.frame=0;d.total=Infinity;
    },
    draw(d){
      cls();const t=d.frame*.012,t2=d.frame*.007;
      function rot(v){let[x,y,z]=v;const cy=Math.cos(t),sy=Math.sin(t),cx=Math.cos(t2),sx=Math.sin(t2);[x,z]=[x*cy-z*sy,x*sy+z*cy];[y,z]=[y*cx-z*sx,y*sx+z*cx];return[x,y,z];}
      const R=300*SC;const proj=d.verts.map(v=>{const[x,y,z]=rot(v);const sc2=900*SC/(900*SC+y*R);return[CX+x*R*sc2,CY-z*R*sc2];});
      for(const[i,j]of d.edges){const c=rbow((i+j)/24+t*.03,.8,.1);seg(proj[i][0],proj[i][1],proj[j][0],proj[j][1],c,2,12);}
      for(const p of proj)dot2(p[0],p[1],4*SC,'#fff',10);
      d.frame++;return d.frame/d.total;
    }
  },
  // 90
  {
    name:'Moire Pattern',cat:'Optical Interference',
    latex:'\\(f(r,\\theta)=\\text{sgn}(\\sin(kr)),\\quad\\text{two grids overlap}\\)',color:'#fde68a',
    init(d){d.frame=0;d.total=Infinity;},
    draw(d){
      cls();const t=d.frame*.015;const step=12;
      for(let px=0;px<CW;px+=step)for(let py=0;py<CH;py+=step){const x=px-CX,y=py-CY;const r1=Math.sqrt(x*x+y*y);const r2=Math.sqrt((x-50*SC*Math.cos(t))**2+(y-50*SC*Math.sin(t))**2);const v1=Math.sin(r1*.04);const v2=Math.sin(r2*.04);const v=(v1+v2+2)/4;ctx.fillStyle=hsv(v*.5+t*.05,.8,v*.8+.2);ctx.fillRect(px,py,step,step);}
      d.frame++;return d.frame/d.total;
    }
  },
];

/* ── UI ────────────────────────────────────── */
const patSel=document.getElementById('patSel');
const playBtn=document.getElementById('playBtn');
const restBtn=document.getElementById('restBtn');
const progFill=document.getElementById('progFill');
const lCat=document.getElementById('lCat');
const lName=document.getElementById('lName');
const eqBox=document.getElementById('eqBox');

PATTERNS.forEach((p,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=`${i+1}. ${p.name}`;
  patSel.appendChild(o);
});

// Added lastTick initialization here
let pidx=0, running=false, raf=null, pd={}, lastTick=performance.now();



function loadPat(i){
  pidx=i;
  const p=PATTERNS[i];
  pd={};
  p.init(pd);
  lCat.textContent=p.cat;
  lName.textContent=p.name;
  lName.style.color=p.color;
  lName.style.textShadow=`0 0 50px ${p.color}88`;
  progFill.style.width='0%';
  progFill.style.background=p.color;
  cls();
  renderLatex(p.latex);
  lastTick = performance.now(); // Reset tick when loading a new pattern
}

const TARGET_FPS = 30;
const FRAME_MS = 1000 / TARGET_FPS;

function loop(){
  const now = performance.now();
  const dt = now - lastTick;
  lastTick = now;

  if(!running) return;
  
  const p=PATTERNS[pidx];
  try {
    if (pd.waiting === undefined) {
      const prog=p.draw(pd);
      progFill.style.width=((Math.sin(pd.frame/80+1)/2+0.5)*100).toFixed(1)+'%';
      if(prog>=1){ pd.waiting = 0; }
    } else {
      progFill.style.width = '100%';
      pd.waiting += dt;
      if (pd.waiting >= 10000) { loadPat(pidx); }
    }
  } catch(e) {
    console.warn(e);
    running=false;
    return;
  }
  // Throttle to ~30fps: calculate how long to sleep before next frame
  const elapsed = performance.now() - now;
  const delay = Math.max(0, FRAME_MS - elapsed);
  raf = setTimeout(() => requestAnimationFrame(loop), delay);
}

playBtn.addEventListener('click',()=>{
  if(running){
    running=false;
    playBtn.textContent='▶ Play';
    clearTimeout(raf); cancelAnimationFrame(raf);
  } else {
    running=true;
    playBtn.textContent='⏸ Pause';
    lastTick = performance.now(); // Reset tick on resume to avoid jumping
    loop();
  }
});

restBtn.addEventListener('click',()=>{
  clearTimeout(raf); cancelAnimationFrame(raf);
  running=false;
  playBtn.textContent='▶ Play';
  loadPat(pidx);
});

patSel.addEventListener('change',()=>{
  clearTimeout(raf); cancelAnimationFrame(raf);
  running=false;
  playBtn.textContent='▶ Play';
  loadPat(parseInt(patSel.value));
});

[['s05',.5],['s10',1],['s20',2]].forEach(([id,v])=>{
  document.getElementById(id).addEventListener('click',function(){
    document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    speedMult=v;
  });
});

// load handler moved to bottom


// renderLatex using KaTeX (no localStorage, no network issues)
async function renderLatex(latex){
  // Strip \( \) delimiters — KaTeX wants raw LaTeX
  const raw = latex.replace(/^\\\(|\\\)$/g,'').replace(/^\$\$|\$\$$/g,'').trim();
  function tryRender(){
    if(!window.katex){ setTimeout(tryRender, 80); return; }
    try {
      katex.render(raw, eqBox, { throwOnError: false, displayMode: false, output: 'html' });
      // Force white color on all KaTeX elements
      eqBox.querySelectorAll('.katex,.katex *').forEach(el => el.style.color = 'rgba(255,255,255,.9)');
    } catch(e) {
      eqBox.textContent = raw;
    }
  }
  tryRender();
}

window.addEventListener('load', () => loadPat(0));
