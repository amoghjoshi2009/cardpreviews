<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Tri-Fold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff9a9e;
            --primary-dark: #ff758c;
            --bg-color: #fceceb;
            --paper-color: #fffbfb;
            --text-color: #5d4037;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgb(255, 241, 242) 0%, rgb(255, 248, 240) 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            /* Prevent bounce scrolling on mobile */
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
        }

        /* --- Layout Containers --- */
        
        /* The Wrapper handles the rotation/centering */
        #view-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 3D Scene --- */
        .scene {
            perspective: 2500px;
            /* We define the scene size explicitly to match the content */
            width: 1000px; 
            height: 600px; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s ease;
            /* This ensures the scaling originates from the center */
            transform-origin: center center; 
        }

        /* The Main Anchor (Center Panel) */
        .card-anchor {
            position: relative;
            width: 425px; 
            height: 650px;
            background: var(--paper-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transform-style: preserve-3d;
            z-index: 10;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1);
            padding-top: 20px;
        }

        /* --- Wings (Left and Right Panels) --- */
        .wing {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 12px;
            cursor: pointer;
        }

        /* LEFT WING CONFIGURATION */
        .wing-left {
            right: 100%;
            transform-origin: right center;
            transform: rotateY(180deg); 
            z-index: 20;
        }

        /* RIGHT WING CONFIGURATION */
        .wing-right {
            left: 100%;
            transform-origin: left center;
            transform: rotateY(-180deg);
            z-index: 5;
        }

        /* --- Panel Faces --- */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* LEFT WING FACES */
        .wing-left .face-front { /* Inside Left: Collage 1 */
            background: #fff;
            transform: rotateY(0deg);
            z-index: 2;
        }
        .wing-left .face-back { /* Cover */
            background: linear-gradient(135deg, #fff0f0 0%, #ffe9e9 100%);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 12px solid #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        /* RIGHT WING FACES */
        .wing-right .face-front { /* Inside Right: Collage 2 */
            background: #fff5f7;
            transform: rotateY(0deg);
        }
        .wing-right .face-back { /* Back Pattern */
            background: #fff;
            transform: rotateY(180deg);
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 15px 15px;
        }

        /* --- OPEN STATE --- */
        .card-anchor.open .wing-left { transform: rotateY(0deg); }
        .card-anchor.open .wing-right { transform: rotateY(0deg); }

        /* --- Typography --- */
        h1 { font-family: 'Dancing Script', cursive; color: var(--primary-dark); text-align: center; line-height: 1.2; }
        h2 { font-family: 'Dancing Script', cursive; color: var(--primary-dark); text-align: center; font-size: 1.6rem; }
        p { font-size: 0.9rem; color: #666; text-align: center; line-height: 1.4; padding: 0 10px; }

        /* Cover Decoration */
        .ribbon {
            position: absolute; top: 0; bottom: 0; left: 40px; width: 40px;
            background: rgba(255,255,255,0.4);
            border-left: 2px dashed #ffb7b2; border-right: 2px dashed #ffb7b2;
            pointer-events: none;
        }
        .sticker {
            position: absolute;
            font-size: 2rem;
            bottom: 20px; right: 20px;
            opacity: 0.8;
            transform: rotate(-10deg);
        }

        /* --- CENTER PANEL: Stack & Message --- */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* The Interactive Stack */
        .stack-container {
            position: relative;
            width: 240px; 
            height: 280px;
            margin: 20px auto 15px auto;
            cursor: pointer;
            perspective: 600px;
        }
        .polaroid {
            position: absolute; width: 100%; height: 100%;
            background: #fff; padding: 12px 12px 50px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.5s ease;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .polaroid img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
        
        /* Initial Stack States */
        .p1 { transform: rotate(-4deg); z-index: 5; }
        .p2 { transform: rotate(3deg); z-index: 4; }
        .p3 { transform: rotate(-2deg); z-index: 3; }
		.p4 { transform: rotate(-5deg); z-index: 2; }
		.p5 { transform: rotate(4deg); z-index: 1; }
        
        /* Animation State */
        .polaroid.shuffle-out {
            transform: translate(150px, 20px) rotate(40deg);
            opacity: 0;
        }

        /* --- COLLAGE STYLES --- */
        .collage-container {
            width: 85%; 
			height:85%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Grids */
        .grid-left, .grid-right {
            display: grid;
            width: 100%;
			height: 100%;
            gap: 10px;
            margin-top: 5px;
        }
        .grid-left { grid-template-columns: 1fr 1fr; grid-template-rows: 1.2fr 0.8fr 1.2fr; }
        .grid-right { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

        /* Common Image Item */
        .c-item {
            position: relative; 
            background: #fff;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            border-radius: 2px;
        }
        /* Hover effect only on devices that support hover */
        @media (hover: hover) {
            .c-item:hover { transform: scale(1.05) rotate(0deg) !important; z-index: 10; }
        }
        .c-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .tape {
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 10px;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            z-index: 5;
        }

        /* Rotations */
        .l1 { grid-column: 1; grid-row: 1 / span 2; transform: rotate(-2deg); }
        .l2 { grid-column: 2; grid-row: 1; transform: rotate(3deg); }
        .l3 { grid-column: 2; grid-row: 2; transform: rotate(-1deg); }
        .l4 { grid-column: 1 / span 2; grid-row: 3; transform: rotate(1deg); }
        
        .r1 { grid-column: 1; grid-row: 1; transform: rotate(-3deg); }
        .r2 { grid-column: 2; grid-row: 1; transform: rotate(2deg); }
        .r3 { grid-column: 1 / span 2; grid-row: 2; transform: rotate(0deg); z-index: 5; }
        .r4 { grid-column: 1; grid-row: 3; transform: rotate(2deg); }
        .r5 { grid-column: 2; grid-row: 3; transform: rotate(-4deg); }

        /* Tap Hint */
        .tap-hint {
            margin-top: 15px; 
            font-size: 0.9rem; 
            color: var(--primary-dark);
            background: rgba(255,255,255,0.8);
            padding: 5px 12px;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }

        /* Rotate Hint Overlay (Optional/Brief) */
        .rotate-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 100;
        }

    </style>
</head>
<body>

<!-- This wrapper is the key. JS manipulates this to rotate the world. -->
<div id="view-wrapper">
    <div class="scene" id="scene">
        <!-- CENTER PANEL (The Anchor) -->
        <div class="card-anchor" id="card">
            
            <div class="center-content">
                <!-- Main Title & Message -->
                <h1 style="font-size: 2.5rem; margin-top: 5px;">Happy Birthday!</h1>
                <p style="margin: 5px 0 15px 0;">
                    To the one who makes every moment brighter. Here's to you!
                </p>

                <!-- Interactive Stack -->
                <div class="stack-container" onclick="event.stopPropagation(); shufflePhotos();">
                    <div class="polaroid p5" id="p5">
                        <img src="https://placehold.co/240x280/ffecf0/ff758c?text=Memories" alt="5">
                    </div>
                    <div class="polaroid p4" id="p4">
                        <img src="https://placehold.co/240x280/ffecf0/ff758c?text=Love" alt="4">
                    </div>
                    <div class="polaroid p3" id="p3">
                        <img src="https://placehold.co/240x280/ffe4e1/d4af37?text=Cute+Pose" alt="3">
                    </div>
                    <div class="polaroid p2" id="p2">
                        <img src="https://placehold.co/240x280/fff0f5/ff9a9e?text=Sweet+Smile" alt="2">
                    </div>
                    <div class="polaroid p1" id="p1">
                        <img src="https://placehold.co/240x280/ffecf0/ff758c?text=Main+Photo" alt="1">
                    </div>
                </div>
                
                <div style="font-size: 0.75rem; color: #bbb; margin-top: 5px;">(Tap photos to shuffle)</div>
            </div>

            <!-- LEFT WING -->
            <div class="wing wing-left" id="leftWing" onclick="toggleCard()">
                <!-- Back Face (THE COVER) -->
                <div class="face face-back">
                    <div class="ribbon"></div>
                    <div style="font-size: 5rem;">🎁</div>
                    <h1 style="font-size: 3.5rem; margin-top: 10px;">For You</h1>
                    <div class="tap-hint">Tap to Open</div>
                    <div class="sticker">✨</div>
                </div>

                <!-- Front Face (Inside Left) -->
                <div class="face face-front">
                    <div class="collage-container">
                        <h2>The Birthday Star</h2>
                        <div class="grid-left">
                            <div class="c-item l1"><div class="tape"></div><img src="https://placehold.co/300x200/ff9a9e/fff?text=Portrait" alt="l1"></div>
                            <div class="c-item l2"><div class="tape"></div><img src="https://placehold.co/150x150/a8e6cf/fff?text=Silly" alt="l2"></div>
                            <div class="c-item l3"><div class="tape"></div><img src="https://placehold.co/150x150/ffd3b6/fff?text=Laugh" alt="l3"></div>
                            <div class="c-item l4"><div class="tape"></div><img src="https://placehold.co/300x200/ffaaa5/fff?text=Style" alt="l4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT WING -->
            <div class="wing wing-right">
                <!-- Back Face -->
                <div class="face face-back"></div>

                <!-- Front Face (Inside Right) -->
                <div class="face face-front">
                    <div class="collage-container">
                        <h2>Best Moments</h2>
                        <div class="grid-right">
                            <div class="c-item r1"><div class="tape"></div><img src="https://placehold.co/150x150/ff9a9e/fff?text=Trip" alt="r1"></div>
                            <div class="c-item r2"><div class="tape"></div><img src="https://placehold.co/150x150/a8e6cf/fff?text=Date" alt="r2"></div>
                            <div class="c-item r3"><div class="tape"></div><img src="https://placehold.co/300x200/fdffb6/5d4037?text=Us+Together" alt="r3"></div>
                            <div class="c-item r4"><div class="tape"></div><img src="https://placehold.co/150x150/ffd3b6/fff?text=Party" alt="r4"></div>
                            <div class="c-item r5"><div class="tape"></div><img src="https://placehold.co/150x150/ffaaa5/fff?text=Fun" alt="r5"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="rotate-hint" id="rotateHint">Turn phone for better view</div>

<script>
    /* --- AUTO-SCALING & ORIENTATION LOGIC --- */
    function adjustView() {
        const wrapper = document.getElementById('view-wrapper');
        const scene = document.getElementById('scene');
        const hint = document.getElementById('rotateHint');
        
        // Dimensions of the card when fully open + margin
        // Center 340 + Left 340 + Right 340 = ~1020. 
        // Height 520. 
        // We set safety margins.
        const contentWidth = 1100;
        const contentHeight = 650; 
        
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        let scale;
        
        // Logic: If on mobile portrait (narrow width), we rotate the view 90 degrees.
        // This forces the "Landscape" experience on a portrait phone.
        const isPortrait = winH > winW;
        const isMobile = winW < 768;

        if (isMobile && isPortrait) {
            // FORCE LANDSCAPE MODE via CSS Transform
            // We map the card's width to the screen's HEIGHT
            // We map the card's height to the screen's WIDTH
            const scaleW = winH / contentWidth;
            const scaleH = winW / contentHeight;
            scale = Math.min(scaleW, scaleH) * 0.95; // 0.95 for padding

            wrapper.style.transform = `translate(-50%, -50%) rotate(90deg)`;
            hint.style.opacity = '0'; // No need to hint if we auto-rotate, or maybe show "Auto-rotated"
        } else {
            // Normal Landscape or Desktop
            const scaleW = winW / contentWidth;
            const scaleH = winH / contentHeight;
            scale = Math.min(scaleW, scaleH) * 0.95;

            wrapper.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            
            // If on mobile but already landscape, looks good.
        }

        // Cap scale so it doesn't get too huge on 4k screens
        scale = Math.min(scale, 1.2);

        scene.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', adjustView);
    window.addEventListener('load', adjustView);
    
    // Initial call
    adjustView();


    /* --- CARD LOGIC --- */
    let isOpen = false;

    function toggleCard() {
        const card = document.getElementById('card');
        
        if (!isOpen) {
            card.classList.add('open');
            isOpen = true;
            setTimeout(fireConfetti, 800);
            
            // Hide tap hint after opening
            const hint = document.querySelector('.tap-hint');
            if(hint) hint.style.display = 'none';
        } else {
            card.classList.remove('open');
            isOpen = false;
        }
    }

    function shufflePhotos() {
        if(!isOpen) return;

        const ids = ['p1', 'p2', 'p3', 'p4', 'p5'];
        const elements = ids.map(id => document.getElementById(id));
        
        // Find the element currently on top (class p1)
        let topEl = elements.find(el => el.classList.contains('p1'));
        if (!topEl) return;

        // Animate it out
        topEl.classList.add('shuffle-out');

        setTimeout(() => {
            topEl.classList.remove('shuffle-out');
            
            // Cycle classes: p1->p5, p2->p1, etc.
            // Logic: current class Number -> new Number
            // p1 becomes p5 (bottom)
            // p2 becomes p1 (top)
            // p3 becomes p2
            // p4 becomes p3
            // p5 becomes p4
            
            elements.forEach(el => {
                const currentClass = Array.from(el.classList).find(c => c.startsWith('p') && c.length === 2);
                let num = parseInt(currentClass.substring(1));
                
                let newNum;
                if (num === 1) newNum = 5;
                else newNum = num - 1;
                
                el.classList.remove(currentClass);
                el.classList.add('p' + newNum);
            });
        }, 500);
    }

    /* --- CONFETTI --- */
    function fireConfetti() {
        var count = 200;
        // On mobile rotated, confetti falls "down" relative to screen, which is "side" relative to card.
        // It actually looks cool, like wind blowing.
        var defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55, });
        fire(0.2, { spread: 60, });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45, });
    }
</script>

</body>
</html>
